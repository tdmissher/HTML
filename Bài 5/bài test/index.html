<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hồ sơ cá nhân</title>
	<link rel="stylesheet" href="style.css">
	<link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

	<div class="nen">
		<div class="thanh_menu">
			<div class="menu active khung_xanh">
				<img src="element-4.png">
			</div>
			<div class="menu">
				<img src="graph.png">
			</div>
      <div class="menu">
				<img src="medal-star.png">
			</div>
			<div class="menu">
				<img src="messages.png">
			</div>
			<div class="menu">
				<img src="setting-2.png">
			</div>
		</div>

		<div class="thanh_ngang">
			<div class="welcome">
				<div>
					<h1>Welcome, Amanda</h1>
					<span class="date">Tue, 07 June 2022</span>
				</div>
				<div class="chao">
					<div class="o_tim_kiem">
						<img src="search-normal.png" alt="Search">
						<input type="text" placeholder="Search">
					</div>
					<button class="chuong">
						<img src="notification-bing.png" alt="Notification">
					</button>
					<img class="picture" src="Rectangle 1072.png" alt="Amanda">
				</div>
			</div>

			<div class="khung_duoi">
				<img class="khung_mau" src="452dd41e6eea8d05642679295aa17dfe2a264a07.jpg" alt="Profile Banner">
				
				<div class="khung_noi_dung">
					<div class="khung_noi_dung_be">
						<div class="row_avatar">
							<img src="08f8792cc4560e6955e1cf3aa9aa4edfe7cc29bf.png" alt="Alexa Rawles">
							<div class="alexa">
								<h2>Alexa Rawles</h2>
								<div class="gmail">alexarawles@gmail.com</div>
							</div>
						</div>
						<button class="edit">Edit</button>
					</div>

					<div class="khung_nhap_lieu">
						<div class="group">
							<label>Full Name</label>
							<div class="chon">
								<input type="text" placeholder="Your First Name">
							</div>
						</div>

						<div class="group">
							<label>Nick name</label>
							<div class="chon">
								<input type="text" placeholder="Your Nick Name">
							</div>
						</div>

						<div class="group">
							<label>Gender</label>
							<div class="chon o_lua_chon">
								<input type="text" placeholder="Your Gender">
								<div class="bieu_tuong_mui_ten"></div>
							</div>
						</div>

						<div class="group">
							<label>Country</label>
							<div class="chon o_lua_chon">
								<input type="text" placeholder="Your Country">
								<div class="bieu_tuong_mui_ten"></div>
							</div>
						</div>

						<div class="group">
							<label>Language</label>
							<div class="chon o_lua_chon">
								<input type="text" placeholder="Your Language">
								<div class="bieu_tuong_mui_ten"></div>
							</div>
						</div>

						<div class="group">
							<label>Time Zone</label>
							<div class="chon o_lua_chon">
								<input type="text" placeholder="Your Time Zone">
								<div class="bieu_tuong_mui_ten"></div>
							</div>
						</div>
					</div>

					<div class="phan_email">
						<div class="tieu_de_phan">My email Address</div>
						
						<div class="o_email">
							<div class="bieu_tuong_email">
								<img src="sms.png" alt="Email">
							</div>
							<div class="thong_tin_email">
								<span class="dia_chi">alexarawles@gmail.com</span>
								<span class="thoi_gian">1 month ago</span>
							</div>
						</div>

						<button class="nut_them_email">+ Add Email Address</button>
					</div>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
