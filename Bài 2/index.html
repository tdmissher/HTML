<!DOCTYPE html>
<html>
<head>
    <title>Jackson Electronics</title>
</head>
<body>
    <!-- em cmt để đánh dấu th ạ -->
    <!-- khung nền  -->
    <div style=" 
    width:800px ;
    height: 1100px;
    background-color: lightskyblue;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    flex-direction: column;
    padding-top: 20px;
    ">
        <!-- khung tieue dèe -->
        <div style="
        width: 400px;
        background-color: aqua;
        text-align: center;
        border: 2px solid black; 
        border-radius: 20px; 
        overflow: hidden; 
        margin-bottom: 25px;
        box-shadow: 8px 8px 0px grey;
        padding: 10px 0px;
        ">
            <table border="0" cellspacing="0" cellpadding="0" style="
            width: 100%; 
            height: 100%;
            border-collapse: collapse;
            ">
                <tr>
                    <!-- Jackson -->
                    <th style="
                        color:black;
                        text-align: center;
                        border-bottom: 5px solid black;
                        font-size: 42px;
                        font-weight: bold;
                        padding-bottom: 10px;
                        "> Jackson
                    </th>
                </tr>
                <tr>
                    <!-- Electronics -->
                     <th style="
                        color:black;
                        text-align: center;
                        font-size: 42px;
                        font-weight: bold;
                        padding-top: 10px;
                     "> Electronics
                     </th>
                </tr>
            </table>
        </div>
        <!-- REGISTRATIOn Form -->
        <h2 style="
        color : black;
        font-size:32px;
        text-align: center;
        margin-top: 15px;
        ">Registration Form</h2>
        
        <!-- Tên giấy``` -->
        <p style="
        color: black;
        font-size: 20px;
        text-align: center;
        margin-top: 15px;
        margin-bottom:3px;
        ">Register yout Jackson Electronics product here</p>
        
        <div style="width: 100%; padding: 0 40px; box-sizing: border-box;">
            <table border="0" cellspacing="10" cellpadding="0" style=
            "width: 100%; 
            font-size: 18px; 
            color: black; 
            ">
                <tr>
                    <td style="
                        width: 150px; 
                        text-align: left;
                        ">First Name:
                    </td>
                    <td colspan="3">
                        <table border="0" cellspacing="0" cellpadding="0" style="width: 100%;">
                            <tr>
                                <td>
                                    <input type="text" style="
                                    width: 200px; 
                                    height: 25px; 
                                    border: 1px solid black;
                                    ">
                                </td>
                                <td style="
                                width: 100px; 
                                text-align: right; 
                                padding-right: 10px;
                                ">Last Name:
                                </td>
                                <td>
                                    <input type="text" style="
                                    width: 200px; 
                                    height: 25px; 
                                    border: 1px solid black;
                                    ">
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <!-- address 1 -->
                    <td style="text-align: left;">Address #1:</td> 
                    <td colspan="3">
                        <input type="text" style="
                        width: 350px; 
                        height: 25px; 
                        border: 1px solid black;
                        ">
                    </td>
                </tr>

                <tr>
                    <!-- address 2 -->
                    <td style="text-align: left;">Address #2:</td>
                    <td colspan="3">
                        <input type="text" style="
                        width: 350px; 
                        height: 25px; 
                        border: 1px solid black;
                        ">
                    </td>
                </tr>

                <tr>
                    <!-- city -->
                    <td style="text-align: left;">City:</td>
                    <td colspan="3">
                        <table border="0" cellspacing="0" cellpadding="0">
                            <tr>
                                <td>
                                    <input type="text" style="
                                        width: 200px; 
                                        height: 25px; 
                                        border: 1px solid black;
                                        ">
                                </td>
                                <!-- state -->
                                <td style="padding: 0 10px;">State:</td>
                                <td>
                                    <input type="text" style="
                                        width: 50px; 
                                        height: 25px; 
                                        border: 1px solid black;
                                        ">
                                </td>
                                <!-- zíp -->
                                <td style="padding: 0 10px;">Zip:</td>
                                <td>
                                    <input type="text" style="
                                        width: 100px; 
                                        height: 25px; 
                                        border: 1px solid black;
                                        ">
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <!-- countri -->
                    <td style="text-align: left;">Country:</td>
                    <td colspan="3">
                        <input type="text" value="United States" style="
                        width: 240px; 
                        height: 25px; 
                        border: 1px solid black;
                        ">
                    </td>
                </tr>

                <tr>
                    <td colspan="4"><hr style="
                        border: 0;
                        border-top: 1px solid black;
                        margin: 10px 0;
                        ">
                    </td>
                </tr>

                <tr>
                    <!-- product -->
                    <td style="text-align: left;">Product:</td>
                    <td colspan="3">
                        <select style=
                        "width: 180px; 
                        height: 28px; 
                        border: 1px solid black;">
                            <option>ScanMaster</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <!-- date purchase -->
                    <td style="text-align: left;">Date Purchased:</td>
                    <td colspan="3">
                        <input type="text" style="
                        width: 240px; 
                        height: 25px; 
                        border: 1px solid black;
                        ">
                    </td>
                </tr>

                <tr>
                    <!-- serial -->
                    <td style="text-align: left;">Serial #:</td>
                    <td colspan="3">
                        <input type="text" style="
                            width: 240px; 
                            height: 25px; 
                            border: 1px solid black;
                            ">
                    </td>
                </tr>

                <tr>
                    <!-- used for -->
                    <td style="
                        text-align: left; 
                        vertical-align: top; 
                        padding-top: 5px;
                        ">Used for:
                    </td>
                    <td colspan="3">
                        <table border="0" cellspacing="5" cellpadding="0">
                            <tr>
                                <!-- tròn home -->
                                <td>
                                    <input type="radio" name="used" id="home"> <label for="home">Home</label>
                                </td>
                                <!-- tròn edu insti -->
                                <td style="padding-left: 40px;">
                                    <input type="radio" name="used" id="edu"> <label for="edu">Educational Institution</label>
                                </td>
                            </tr>

                            <tr>
                                <!-- tròn business -->
                                <td>
                                    <input type="radio" name="used" id="bu"> <label for="bu">Business</label>
                                </td>
                                <!-- tròn other -->
                                <td style="padding-left: 40px;">
                                    <input type="radio" name="used" id="other_use"> <label for="other_use">Other</label>
                                </td>
                            </tr>
                            <tr>
                                <!-- tròn gove -->
                                <td colspan="2">
                                    <input type="radio" name="used" id="gov"> <label for="gov">Government</label>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="text-align: left; vertical-align: top; padding-top: 5px;">System (check all that apply):</td>
                    <td colspan="3">
                        <table border="0" cellspacing="5" cellpadding="0">
                            <tr>
                                <td>
                                    <input type="checkbox" id="win"> <label for="win">Windows</label>
                                </td>
                                <td style="padding-left: 40px;">
                                    <input type="checkbox" id="unix"> <label for="unix">UNIX</label>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <input type="checkbox" id="mac"> <label for="mac">Macintosh</label>
                                </td>
                                <td style="padding-left: 40px;">
                                    <input type="checkbox" id="other_sys"> <label for="other_sys">Other</label>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td colspan="4"><hr style="border: none; border-top: 1px solid black; margin: 10px 0;"></td>
                </tr>

                <tr>
                    <!-- cmt -->
                    <td style="text-align: left; vertical-align: top;resize: none;">Comments?:</td>
                    <td colspan="3">
                        <textarea style="width: 100%; height: 130px; border: 1px solid black;"></textarea>
                    </td>
                </tr>

                <tr>
                    <!-- click to gui/huy -->
                    <td colspan="3" style="text-align: center; padding-top: 20px;margin-bottom: auto;">
                        <input type="button" value="Click to register" style="
                            padding: 5px 15px; 
                            font-size: 16px; 
                            background-color: white; 
                            border: 1px solid black; 
                            margin-right: 10px; 
                            cursor: pointer;
                            margin-bottom: 0px;
                            ">
                        <input type="button" value="Click to cancel" style="
                        padding: 5px 15px; 
                        font-size: 16px; 
                        background-color: white; 
                        border: 1px solid black; 
                        cursor: pointer;
                        margin-bottom: 0px;
                        ">
                    </td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
